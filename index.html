<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AD Robot Time Series</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <section class="panel">
      <div class="summary" aria-label="Today's metrics">
        <strong>Tdy</strong><span>0%</span><span>$0</span><span>$0</span><span>0</span><span>0</span><span>—</span>
      </div>
      <div class="chart-wrap">
        <div id="chart" aria-label="Time series chart"></div>
      </div>
      <button class="edit" aria-label="Edit chart">✎⌄</button>
    </section>
  </main>
  <script src="chart.js"></script>
  <script src="app.js"></script>
</body>
</html>
